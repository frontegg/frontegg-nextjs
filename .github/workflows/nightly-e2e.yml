name: Nightly real-tenant E2E

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-e2e-real
  cancel-in-progress: false

env:
  CI: true

jobs:
  e2e-real:
    name: Run real-tenant Playwright suite
    # Pinned: the repo's Playwright version cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Use the encryption password secret, or a throwaway one
        env:
          SECRET_PASSWORD: ${{ secrets.FRONTEGG_ENCRYPTION_PASSWORD }}
        run: |
          password=${SECRET_PASSWORD:-$(openssl rand -hex 32)}
          echo "::add-mask::$password"
          echo "FRONTEGG_ENCRYPTION_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: E2E real
        working-directory: packages/nextjs
        env:
          # Defaults to the public demo tenant when the secrets are not set.
          FRONTEGG_BASE_URL: ${{ secrets.FRONTEGG_BASE_URL || 'https://demo.frontegg.com' }}
          FRONTEGG_CLIENT_ID: ${{ secrets.FRONTEGG_CLIENT_ID || 'b6adfe4c-d695-4c04-b95f-3ec9fd0c6cca' }}
          FRONTEGG_APP_URL: http://localhost:3000
        run: npx playwright test --project=e2e-real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-nightly
          path: packages/nextjs/playwright-report/
          retention-days: 14
