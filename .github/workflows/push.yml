name: Push Workflow
on:
  # When after commit pushed to branches not master nad release/next
  push:
    branches-ignore:
      - 'master'

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true


env:
  CI: true
jobs:
  init:
    name: 'Install, Build and Test'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Read .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT
      - name: Use Node.js ${{ steps.nvm.outputs.NODE_VERSION }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
      - run: yarn install
      - run: yarn build
      - name: Generate a throwaway encryption password for this run
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "FRONTEGG_ENCRYPTION_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Unit tests (vitest)
        working-directory: packages/nextjs
        run: yarn test:unit:coverage
      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: packages/nextjs/coverage
          retention-days: 14
      - name: Run Playwright tests
        run: npx playwright test
        env:
          DEBUG: "pw:webserver"
          FRONTEGG_TEST_URL: "http://localhost:3001"
          FRONTEGG_APP_URL: "http://localhost:3000"
          FRONTEGG_BASE_URL: "https://demo.frontegg.com"
          FRONTEGG_CLIENT_ID: "b6adfe4c-d695-4c04-b95f-3ec9fd0c6cca"
      - name: Run Playwright unit specs (packages/nextjs)
        working-directory: packages/nextjs
        run: npx playwright test --project=unit-playwright
        env:
          PW_SKIP_WEBSERVER: "1"
          FRONTEGG_APP_URL: "http://localhost:3000"
          FRONTEGG_BASE_URL: "https://demo.frontegg.com"
          FRONTEGG_CLIENT_ID: "b6adfe4c-d695-4c04-b95f-3ec9fd0c6cca"
      - name: Prepare example app env for mocked E2E
        run: node scripts/prepare-e2e-env-file.js --force
        env:
          FRONTEGG_APP_URL: "http://localhost:3000"
          FRONTEGG_BASE_URL: "https://demo.frontegg.com"
          FRONTEGG_CLIENT_ID: "b6adfe4c-d695-4c04-b95f-3ec9fd0c6cca"
      - name: Run mocked E2E (packages/nextjs)
        working-directory: packages/nextjs
        run: npx playwright test --project=e2e-mocked
      # The mocked .env.local trusts a test JWT key; the real tenant's tokens must be verified against its own JWKS.
      - name: Remove mocked E2E env
        run: rm -f packages/example-app-directory/.env.local
      - name: Run real-tenant E2E (packages/nextjs)
        working-directory: packages/nextjs
        # Defaults to the public demo tenant used above; set the FRONTEGG_BASE_URL / FRONTEGG_CLIENT_ID secrets to test another tenant.
        env:
          FRONTEGG_BASE_URL: ${{ secrets.FRONTEGG_BASE_URL || 'https://demo.frontegg.com' }}
          FRONTEGG_CLIENT_ID: ${{ secrets.FRONTEGG_CLIENT_ID || 'b6adfe4c-d695-4c04-b95f-3ec9fd0c6cca' }}
          FRONTEGG_APP_URL: "http://localhost:3000"
        run: npx playwright test --project=e2e-real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-nextjs
          path: packages/nextjs/playwright-report/
          retention-days: 14
